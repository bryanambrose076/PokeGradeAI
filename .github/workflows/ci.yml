name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - run: docker build -t pokegrade .

      - run: >
          docker run --rm
          -v "$PWD/tests:/app/tests"
          -v "$PWD/pytest.ini:/app/pytest.ini"
          pokegrade
          sh -c "pip install -q -r requirements-dev.txt && pytest -q"

      - run: >
          docker run --rm
          -v "$PWD/eval:/app/eval"
          -v "$PWD/eval.py:/app/eval.py"
          pokegrade
          python eval.py --min-top1 22 --min-top5 25

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04-arm
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::017421876144:role/deploy-pokegrade
          aws-region: us-east-2

      - uses: aws-actions/amazon-ecr-login@v2

      - run: |
          IMAGE=017421876144.dkr.ecr.us-east-2.amazonaws.com/pokegrade:${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          aws lambda update-function-code --function-name PokeGradeAI --image-uri $IMAGE
          aws lambda wait function-updated-v2 --function-name PokeGradeAI

      - run: curl -sf --retry 5 --retry-all-errors --max-time 180 https://vwvdyeg3h7wtvpxtci3mqnvmei0tmrny.lambda-url.us-east-2.on.aws/health
