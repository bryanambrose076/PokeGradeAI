<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PokeGrade Scanner</title>
</head>
<body>
  <h1>PokeGrade Scanner</h1>
  <p>Take a photo of a card to identify it and look up prices.</p>
  
  <input type="file" id="photo" accept="image/*" capture="environment">
  <p><small>Photos are saved for 90 days to improve matching.</small></p>

  <div id="result" style="white-space: pre-line;"></div>

  <div id="wrong-card" hidden>
    <p><button id="wrong-button">Wrong card?</button></p>
    <div id="report" hidden>
      <label>What card is it? <input id="card-search" type="search" maxlength="100" autocomplete="off"></label>
      <p>Did you mean…?</p>
      <div id="suggestions"></div>
      <p><button id="none-button">None of these</button></p>
    </div>
    <p id="report-status"></p>
  </div>

  <script>
    const photoInput = document.getElementById("photo");
    const resultBox = document.getElementById("result");

    function formatPrice(price) {
      if (price === null || price === undefined) return "N/A";
      if (price < 0) return `-$${Math.abs(price).toFixed(2)}`;
      return `$${price.toFixed(2)}`;
    }

    // Shrink the photo before upload: phone photos can be several MB, close to Lambda's ~6MB limit.
    // 2000px / JPEG 0.9 matched full-size accuracy on the eval photos. Falls back to the original on any error.
    const MAX_SIDE = 2000;

    async function resizePhoto(file) {
      try {
        const bitmap = await createImageBitmap(file);  // applies the phone's rotation tag
        const scale = MAX_SIDE / Math.max(bitmap.width, bitmap.height);
        if (scale >= 1) return file;  // already small enough

        const canvas = document.createElement("canvas");
        canvas.width = Math.round(bitmap.width * scale);
        canvas.height = Math.round(bitmap.height * scale);
        canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);

        const blob = await new Promise(resolve => canvas.toBlob(resolve, "image/jpeg", 0.9));
        return blob || file;
      } catch {
        return file;
      }
    }

    photoInput.addEventListener("change", async () => {
      const photo = photoInput.files[0];
      if (!photo) return;

      resultBox.textContent = "Scanning...";
      resetReport(null);

      const formData = new FormData();
      formData.append("file", await resizePhoto(photo), "photo.jpg");

      let response, data;
      try {
        response = await fetch("/scan", { method: "POST", body: formData });
        data = await response.json();
      } catch {
        resultBox.textContent = "Something went wrong. Please try again.";
        return;
      }

      if (!response.ok) {
        resultBox.textContent = `Something went wrong: ${data.detail}`;
        return;
      }

      resetReport(data.scan_id);

      if (data.card === null) {
        resultBox.textContent = "Couldn't identify this card.";
        return;
      }

      const lines = [
        data.card.name,
        `${data.card.set_name} · #${data.card.number}`,
      ];

      if (data.low_confidence) {
        if (data.runner_up !== null) {
          const ru = data.runner_up;
          lines.push(`⚠️ Not sure. Could also be ${ru.name} (${ru.set_name} · #${ru.number})`);
        } else {
          lines.push("⚠️ Not sure about this match");
        }
      }

      lines.push("");

      if (data.prices === null) {
        lines.push("Prices unavailable");
      } else {
        lines.push(`Raw: ${formatPrice(data.prices.raw)}`);
        lines.push(`PSA 9: ${formatPrice(data.prices.psa9)}`);
        lines.push(`PSA 10: ${formatPrice(data.prices.psa10)}`);
        lines.push(`Profit if PSA 10: ${formatPrice(data.profit)}`);
      }

      resultBox.textContent = lines.join("\n");
    });

    // "Wrong card?" box: search as the user types, then send the card they pick
    const wrongCard = document.getElementById("wrong-card");
    const reportBox = document.getElementById("report");
    const searchInput = document.getElementById("card-search");
    const suggestions = document.getElementById("suggestions");
    const reportStatus = document.getElementById("report-status");
    let scanId = null;
    let searchTimer = null;

    // Hide and clear the box; show the button again only if this scan was saved
    function resetReport(id) {
      scanId = id;
      wrongCard.hidden = id === null;
      document.getElementById("wrong-button").hidden = false;
      reportBox.hidden = true;
      searchInput.value = "";
      suggestions.replaceChildren();
      reportStatus.textContent = "";
    }

    document.getElementById("wrong-button").addEventListener("click", () => {
      document.getElementById("wrong-button").hidden = true;
      reportBox.hidden = false;
      searchInput.focus();
    });

    // Search once the user stops typing for 300ms
    searchInput.addEventListener("input", () => {
      clearTimeout(searchTimer);
      searchTimer = setTimeout(async () => {
        const q = searchInput.value.trim();
        if (!q) {
          suggestions.replaceChildren();
          return;
        }
        try {
          const cards = await (await fetch(`/search?q=${encodeURIComponent(q)}`)).json();
          if (searchInput.value.trim() !== q) return;  // a newer search is on its way
          suggestions.replaceChildren(...cards.map(card => {
            const button = document.createElement("button");
            button.textContent = `${card.name} — ${card.set_name} #${card.number}`;
            button.addEventListener("click", () => sendReport(card.card_id));
            const row = document.createElement("p");
            row.appendChild(button);
            return row;
          }));
        } catch {
          reportStatus.textContent = "Search failed. Please try again.";
        }
      }, 300);
    });

    document.getElementById("none-button").addEventListener("click", () => sendReport(null));

    // Send the report; card_id is null for "None of these"
    async function sendReport(cardId) {
      const query = searchInput.value.trim();
      if (!query) {
        reportStatus.textContent = "Type what card it is first.";
        return;
      }
      try {
        const response = await fetch("/corrections", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ scan_id: scanId, query, card_id: cardId }),
        });
        if (!response.ok) {
          reportStatus.textContent = `Couldn't send: ${(await response.json()).detail}`;
          return;
        }
      } catch {
        reportStatus.textContent = "Couldn't send. Please try again.";
        return;
      }
      reportBox.hidden = true;
      reportStatus.textContent = "Thanks! We'll use this to improve matching.";
    }
  </script>
</body>
</html>
